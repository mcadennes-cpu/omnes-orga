# ============================================================================
# desiderata.yaml — SOURCE UNIQUE DE VÉRITÉ pour le planning du cabinet
# ============================================================================
# Ce fichier remplace les tableaux dupliqués qui existaient dans
# `_Skills/refaire-le-planning.md` et `parametres.md`. Ces deux fichiers ne
# doivent plus contenir de tableau de contraintes : ils pointent vers celui-ci.
#
# Toute modification d'une contrainte (nouveau desiderata, associé, règle)
# se fait ICI, nulle part ailleurs. Le script `verifie-planning.py` et le
# futur optimiseur (`1_optimize.py`) doivent lire ce fichier directement.
#
# Dernière mise à jour : 2026-08-01
# Historique :
#   - 2026-07-14 : création — fusion des données de refaire-le-planning.md
#     et parametres.md. Conflit détecté sur les gardes d'IEG entre les deux
#     anciennes sources.
#   - 2026-07-14 : conflit IEG confirmé par l'intéressée — voir fiche IEG.
#   - 2026-08-01 : confrontation avec les créneaux réellement déclarés dans
#     l'agenda (étape 6 / MOD-1). Trois écarts arbitrés par Matthieu :
#       * J5 → l'horaire de la base fait foi (12:00-20:00) et J5 sort du
#         roulement des associés (voir fiche J5).
#       * J2 Beaune → ce fichier fait foi (14:00-22:00) ; la base portait
#         10:00-22:00, corrigée.
#       * J5 bis (créneau présent en base, absent d'ici) → désactivé, non
#         reconduit ici.
#     Ajout de la section 1bis (correspondance codes ↔ créneaux de l'agenda).
#
# ⚠️ Ce fichier est une COPIE de référence, placée dans le dépôt Omnès-Orga
# pour servir de source au parseur de roulement (MOD-1). Le fichier maître
# vit dans le pipeline Python (1_optimize.py / verifie-planning.py) : y
# reporter les corrections du 2026-08-01, sans quoi les deux divergeront.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. Créneaux — définition des plages horaires
# ----------------------------------------------------------------------------
creneaux:
  J1:
    horaire: "08:00-16:00"
    site_impose: Beaune
    unique_par_site_jour: true
    commentaire: "Créneau rare, 1 seul par jour à Beaune"
  J2:
    horaire: "14:00-22:00"
    unique_par_site_jour: true
    commentaire: "Créneau rare, 1 seul par site et par jour — la ressource la plus disputée"
    # 2026-08-01 : la base déclarait J2 Beaune en 10:00-22:00 contre 14:00-22:00
    # à Dijon. Arbitré par Matthieu — cet horaire fait foi, J2 dure 8 h sur les
    # deux sites ; le créneau a été corrigé dans l'agenda.
  J3: {horaire: "08:00-18:30", unique_par_site_jour: false}
  J4: {horaire: "08:00-18:30", unique_par_site_jour: false}
  J5:
    horaire: "12:00-20:00"
    unique_par_site_jour: false
    usage_habituel: remplacants   # PREFERENCE, pas une regle dure
    hors_roulement: true
    # 2026-08-01 : ce fichier annonçait 08:00-18:30 (journée d'associé). Arbitré
    # par Matthieu — l'horaire de la base fait foi. Les chiffres le confirment :
    # sur 239 gardes J5, 133 sont tenues par un remplaçant et 16 seulement par
    # un associé, et la ligne J5 est VIDE dans le roulement V2 (quasi vide en
    # V1). J5 est donc un créneau de renfort d'après-midi, hors roulement,
    # au même titre que J6.
  J6:
    horaire: "08:00-14:00"
    usage_habituel: remplacants   # PREFERENCE, pas une regle dure
    hors_roulement: true
    commentaire: "Va en pratique aux remplaçants — concept 'préJ2' abandonné"
    # ⚠️ 2026-08-01, précisé par Matthieu : ce fichier disait « ne doit JAMAIS
    # contenir un associé » et classait donc J6 parmi les règles dures. C'est
    # FAUX. Rien ne doit empêcher d'assigner un associé sur un J6 : c'est un
    # usage habituel, pas un invariant. Ne jamais en faire un contrôle bloquant
    # dans l'application (tout au plus un avertissement), et ne pas le compter
    # comme une violation dans verifie-planning.py.
    #
    # Le créneau s'appelait "Pré J2 Dijon" dans l'agenda ; renommé "J6 Dijon"
    # le 2026-08-01 (même horaire, 176 de ses 257 gardes tenues par des
    # remplaçants, aucune règle de roulement).
  J7: {horaire: "08:00-18:30", unique_par_site_jour: false}
  J8: {horaire: "08:00-18:30", unique_par_site_jour: false}

# Fenêtre de recouvrement maximal utilisée pour vérifier la capacité :
# J1 (8-16), J2 (14-22) et les créneaux journée (8-18:30) se chevauchent
# tous entre 14h et 16h. C'est à cette fenêtre que la contrainte de
# capacité (règle dure n°4) est la plus stricte.
fenetre_recouvrement_max: "14:00-16:00"

# ----------------------------------------------------------------------------
# 1bis. Correspondance codes ↔ créneaux déclarés dans l'agenda (2026-08-01)
# ----------------------------------------------------------------------------
# Les créneaux de l'application (table shift_types) portent le site DANS leur
# nom : la correspondance est donc un couple (code, site) → un shift_type, et
# non un simple code. Elle est reprise ici pour pré-remplir l'écran de
# correspondance de l'import Excel (MOD-1).
#
# Un code peut n'exister que sur un site : c'est normal et voulu.

# État vérifié en base le 2026-08-01, après les scripts 22-6A-1 et 22-6A-2 :
# 19 créneaux, 9 à Beaune et 10 à Dijon, plus aucun espace parasite dans les
# noms. La correspondance ci-dessous est donc exacte et directement exploitable.

correspondance_agenda:
  J1:   {Beaune: "J1 Beaune"}
  J2:   {Beaune: "J2 Beaune", Dijon: "J2 Dijon"}
  J3:   {Beaune: "J3 Beaune", Dijon: "J3 Dijon"}
  J4:   {Beaune: "J4 Beaune", Dijon: "J4 Dijon"}
  J5:   {Dijon: "J5 Dijon"}                  # pas de J5 à Beaune
  J6:   {Beaune: "J6 Beaune", Dijon: "J6 Dijon"}
  J7:   {Beaune: "J7 Beaune", Dijon: "J7 Dijon"}
  J8:   {Beaune: "J8 Beaune", Dijon: "J8 Dijon"}
  Garde:   {Beaune: "WE1 beaune 08h-20h", Dijon: "WE1 Dijon"}
  Doublon: {Beaune: "WE2 beaune 08h-20h", Dijon: "WE2 Dijon"}
  # 2026-08-02 : « WE 2 Dijon » renommé « WE2 Dijon » (script 22-6H-3).
  # L'espace parasite faisait dériver deux codes distincts — « WE 2 » et
  # « WE2 » — donc deux lignes de doublon dans la grille du roulement.

# Créés le 2026-08-01 (script 22-6A-2) : J4, J7, J8 et J6 Beaune. Beaune passe
# de 3 à 7 créneaux en semaine et peut donc occuper ses 6 salles.
#
# Motif immédiat : le roulement V2 place 6 affectations sur J4 Beaune (IEG en
# S1 jeudi, S2 vendredi, S3 mercredi, S3 vendredi ; MY en S4 mardi et S6
# mardi), créneau qui n'existait pas — son import aurait échoué. Les salles,
# elles, existaient déjà toutes les 6 depuis le 2025-11-17 : le site n'avait
# simplement jamais ouvert que Salle 1 et Salle 2, faute de créneaux.
#
# Créneaux de l'agenda sans correspondance dans les fichiers de roulement :
#    "J5 bis Dijon" — désactivé le 2026-08-01 (3 gardes en tout, aucune à
#    venir, la dernière le 2026-03-02, aucune règle de roulement).

# ----------------------------------------------------------------------------
# 2. Sites
# ----------------------------------------------------------------------------
sites:
  Beaune:
    salles: 6
    salles_avant_demenagement: 2  # historique — déménagement effectué en 2026-07
    salles_reellement_ouvertes: 2  # 2026-08-01 : Salle 1 et Salle 2 seulement
    visites_a_domicile: true
    # ⚠️ Précisé par Matthieu le 2026-08-01, indevinable depuis les données :
    # à Beaune, le médecin en J1 consulte AU CABINET de 08:00 à 13:00, puis part
    # en VISITES À DOMICILE l'après-midi. La salle se libère donc à 13:00 et le
    # J2 (14:00-22:00) peut l'occuper — le chevauchement apparent des horaires
    # J1 (08:00-16:00) et J2 n'est PAS un conflit de salle.
    # Il n'y a pas de visites à domicile à Dijon : c'est ce qui explique que
    # l'occupation des salles diffère entre les deux sites.
  Dijon:
    salles: 6
    visites_a_domicile: false

# ----------------------------------------------------------------------------
# 2bis. Salle par créneau
# ----------------------------------------------------------------------------
# Un créneau se tient toujours dans la même salle : la salle est donc une
# propriété du CRÉNEAU (colonne agenda.shift_types.default_room_id), et non du
# roulement — le fichier de roulement ne mentionne d'ailleurs aucune salle.
#
# La réciproque est fausse : une même salle peut porter DEUX créneaux, à
# condition que leurs horaires ne se recouvrent pas réellement.
#   . Dijon  : J6 (08:00-14:00) puis J2 (14:00-22:00) — d'où l'ancien nom
#              « pré J2 ». Seul cas à Dijon.
#   . Beaune : J1 (au cabinet 08:00-13:00, puis visites) puis J2.

# ----------------------------------------------------------------------------
# 3. Règles dures (invariants — cf. refaire-le-planning.md pour le détail humain)
# ----------------------------------------------------------------------------
regles_dures:
  max_medecins_simultanes: 9
  max_salles_par_site: 6
  j1_j2_vides_tolerance_par_site: 3   # nombre max de J1/J2 vides toléré par site sur les 8 sem.
  lundi_off_apres_weekend_travaille: true  # lundi de la semaine suivante = off obligatoire

# ----------------------------------------------------------------------------
# 4. Cibles J2 retenues pour la V2 (nombre de J2 sur le roulement 8 semaines)
# ----------------------------------------------------------------------------
# Ces chiffres ont été vérifiés contre planning-V2_2026-07.xlsx le 2026-07-14 :
# comptage exact, conforme à 100%.

# ----------------------------------------------------------------------------
# 5. Couples (contraintes croisées entre deux médecins)
# ----------------------------------------------------------------------------
couples:
  - medecins: [CB, AS]
    regle: "J2 le même jour, si possible sur des sites opposés"
    frequence_min: "4/8"   # au moins 4 semaines sur 8
    statut: préférence      # pas une règle dure

# ----------------------------------------------------------------------------
# 6. Médecins associés — fiche individuelle
# ----------------------------------------------------------------------------
# site : Fixe Beaune / Fixe Dijon / Préférence Beaune / Préférence Dijon / Flexible
# a_valider : true tant que la ligne "Règle site" de parametres.md n'a pas été
#             explicitement confirmée par le médecin concerné (état au 2026-07-14)
# interdictions_j2 : jours où ce médecin ne doit JAMAIS être en J2
# jours_non_travailles : jours de la semaine jamais travaillés
# max_par_periode : plafond sur une combinaison jour+créneau sur une fenêtre glissante
# notes_manuelles : desiderata réels mais trop nuancés pour être vérifiés
#                    automatiquement — à relire à l'oeil à chaque révision
#                    (le script verifie-planning.py les affiche mais ne peut
#                    pas juger s'ils sont respectés)

medecins:

  MC:
    nom: Matthieu Cadennes
    site: Flexible
    j2_cible: 10
    gardes_weekend: [S2, S6]
    regle_recurrente:
      jour: Mercredi
      type: "off un mercredi sur deux"
      frequence_cible: "4/8"
      quand_travaille:
        creneau: J1
        site: Beaune
    notes_manuelles: []

  CC:
    nom: Caroline Chauvet
    site: Flexible
    j2_cible: 8
    gardes_weekend: [S2, S6]
    regle_recurrente:
      jour: Mercredi
      type: "plafond de mercredis travaillés"
      frequence_max: "1/4"   # ≈ 2/8
    notes_manuelles: []

  XB:
    nom: Xavier Baudrillart
    site: Flexible
    j2_cible: 8
    gardes_weekend: [S3, S7]
    notes_manuelles:
      - "Contraintes individuelles à compléter (aucune remontée à ce jour)."

  TE:
    nom: Thomas Etienne
    site: Flexible
    j2_cible: 9
    gardes_weekend: [S3, S7]
    notes_manuelles: []

  AS:
    nom: Airelle Sauvage
    site: "Préférence Dijon"
    a_valider: true
    j2_cible: 8
    gardes_weekend: [S1, S5]
    couple_avec: CB
    notes_manuelles: []

  CB:
    nom: Christophe Bertrand
    site: "Préférence Dijon"
    a_valider: true
    j2_cible: 7
    gardes_weekend: [S1, S5]
    interdictions_j2:
      - jour: Mardi
    max_par_periode:
      - creneau: J2
        jour: Vendredi
        max: 1
        fenetre_semaines: 4
    couple_avec: AS

  IEG:
    nom: Imane El Gari
    site: "Fixe Beaune"
    j2_cible: 8
    gardes_weekend: [S4]
    doublons_weekend: [S8]
    # Confirmé par IEG le 2026-07-14 : garde = S4 uniquement, doublon permanent = S8.
    # Le doublon qui apparaissait en S5 sur planning-V2_2026-07.xlsx était une
    # convenance ponctuelle au coup par coup, PAS un desiderata permanent — ne
    # pas le reporter dans les prochains roulements sans nouvelle demande explicite.
    notes_manuelles:
      - "100% Beaune (site fixe, aucune exception)."

  LD:
    nom: Laurène Daudin
    site: "Préférence Dijon"
    a_valider: true
    j2_cible: 6
    gardes_weekend: []
    doublons_weekend: [S3, S6]
    pas_de_garde_seule: true
    notes_manuelles:
      - "Éviter un J2 suivi le lendemain d'un créneau du matin, surtout sur l'autre site."

  MY:
    nom: Mireille Yuan
    site: Flexible
    j2_cible: 8
    gardes_weekend: [S4, S8]
    jours_non_travailles: [Mercredi]
    notes_manuelles: []

# ----------------------------------------------------------------------------
# 7. Desiderata ponctuels (valables pour UN remaniement donné, pas permanents)
# ----------------------------------------------------------------------------
# Ne pas laisser grossir cette section indéfiniment : une fois le remaniement
# archivé (étape A d'IPCRA), déplacer ces lignes dans le journal du projet
# archivé plutôt que de les garder ici.
desiderata_ponctuels:
  - medecin: LD
    detail: "S5 : lundi off + jeudi Dijon"
  - medecin: MY
    detail: "Mercredis S1/S3/S4/S6 réaffectés (voir parametres.md § desiderata reçus)"
  - medecin: IEG
    detail: "Doublon S5 sur le roulement V2 (planning-V2_2026-07.xlsx) : convenance
      ponctuelle, pas un desiderata permanent. Doublon permanent = S8 uniquement."
  - medecin: MC
    detail: "Convertir 1 J2 du vendredi (S3 ou S7) en journée, pas celui juste avant
      sa garde — demande faite pour le roulement V2, à reconfirmer si nouveau
      remaniement."
  - medecin: CC
    detail: "J2 du vendredi placé le vendredi qui précède sa garde — demande faite
      pour le roulement V2, à reconfirmer si nouveau remaniement."
  - medecin: TE
    detail: "Remplacer 1 J2 par une journée (Dijon ou Beaune), jour précis non
      tranché — demande faite pour le roulement V2, à reconfirmer si nouveau
      remaniement."
